<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William - وليام</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #000000;
            color: #00ff66;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* شاشة الشروط والأحكام (تظهر أول مرة فقط) */
        #termsModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .terms-box {
            background: #0d1117;
            border: 2px solid #ff3333;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }
        .terms-box h2 {
            color: #ff3333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .terms-box p {
            color: #00ff66;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: center;
        }
        .terms-btns {
            display: flex;
            gap: 10px;
        }
        .terms-btns button {
            flex: 1;
            padding: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-accept { background: #00ff66; color: #000; }
        .btn-reject { background: #ff3333; color: #fff; }

        /* الهيدر والشعار */
        header {
            background: #0d1117;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #ff3333;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
        .welcome-msg {
            font-size: 13px;
            color: #00ff66;
            margin-top: 5px;
        }

        /* المحتوى والأدوات */
        .main-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .section-box {
            background: #0d1117;
            border: 1px solid #00ff66;
            padding: 15px;
            border-radius: 8px;
        }
        .section-box h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #ff3333;
        }
        .input-target {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .platform-select {
            width: 100%;
            padding: 8px;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .action-btn {
            background: #ff3333;
            color: #fff;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .action-btn:hover { background: #cc0000; }

        /* شريط التحميل الاستخباراتي */
        #loadingArea {
            display: none;
            margin-top: 10px;
        }
        .progress-bar {
            width: 100%;
            background: #000;
            height: 8px;
            border: 1px solid #00ff66;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #00ff66;
            transition: width 0.3s linear;
        }
        .loading-status {
            font-size: 12px;
            color: #ff3333;
            margin-top: 5px;
        }

        /* الشات */
        #chatArea {
            display: none;
            flex: 1;
            flex-direction: column;
            background: #0d1117;
            border: 1px solid #00ff66;
            border-radius: 8px;
            overflow: hidden;
        }
        .chat-header {
            background: #161b22;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }
        .msg { padding: 8px; border-radius: 5px; max-width: 80%; }
        .msg.admin { background: #580606; color: #ff9999; align-self: flex-end; }
        .msg.target { background: #033a16; color: #99ffbb; align-self: flex-start; }
        .chat-input-area {
            padding: 10px;
            background: #161b22;
            display: flex;
            gap: 5px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 8px;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            border-radius: 4px;
        }

        /* التنقل السفلي والفوتر */
        .nav-tools {
            display: flex;
            gap: 5px;
            padding: 10px;
            background: #0d1117;
            border-top: 1px solid #30363d;
        }
        .nav-btn {
            background: #161b22;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .footer-contact {
            text-align: center;
            padding: 5px;
            font-size: 11px;
            color: #ff3333;
            background: #000;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <!-- شاشة الشروط والأحكام (تظهر أول مرة فقط) -->
    <div id="termsModal" style="display:none;">
        <div class="terms-box">
            <h2>شروط وسياسة وليام</h2>
            <p>هل تقبل شروط وسياسة وليام؟</p>
            <div class="terms-btns">
                <button class="btn-accept" onclick="acceptTerms()">قبول</button>
                <button class="btn-reject" onclick="rejectTerms()">رفض</button>
            </div>
        </div>
    </div>

    <!-- الهيدر -->
    <header>
        <div class="logo">[ W ] وليام</div>
        <div class="welcome-msg">مرحبا بك في وليام</div>
    </header>

    <!-- المحتوى والأدوات -->
    <div class="main-content" id="mainContentArea">
        
        <!-- أداة يوزر الهدف -->
        <div class="section-box">
            <h3>استهداف حساب (إنستا / تيك توك)</h3>
            <select class="platform-select" id="platformSelect">
                <option value="insta">إنستغرام (Instagram)</option>
                <option value="tiktok">تيك توك (TikTok)</option>
            </select>
            <input type="text" class="input-target" id="targetUsername" placeholder="ادخل اسم الهدف...">
            <button class="action-btn" onclick="startTargetProcess()">بدء الاختراق</button>
            
            <div id="loadingArea">
                <div class="loading-status" id="loadingStatusText">جاري البحث عن الحساب..</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            
            <button class="action-btn" id="infoRequestBtn" style="display:none; margin-top:10px; background:#00ff66; color:#000;" onclick="openChat()">طلب المعلومات</button>
        </div>

        <!-- أداة رابط التصيد -->
        <div class="section-box">
            <h3>صنع رابط تصيد (وليام)</h3>
            <button class="action-btn" onclick="startSimpleLoading()">توليد الرابط</button>
        </div>

        <!-- أداة المنصات المزيفة -->
        <div class="section-box">
            <h3>صنع رابط منصات مزيفة (وليام)</h3>
            <select class="platform-select" id="fakePlatform">
                <option value="insta">صفحة إنستغرام مزيفة</option>
                <option value="tiktok">صفحة تيك توك مزيفة</option>
            </select>
            <button class="action-btn" onclick="startSimpleLoading()">إنشاء الصفحة</button>
        </div>

    </div>

    <!-- نافذة الشات -->
    <div id="chatArea">
        <div class="chat-header">
            <span>الشات المباشر مع المالك</span>
            <button class="nav-btn" style="flex:0;" onclick="switchTab('tool')">العودة للأدوات</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="msg target">مرحباً بك، تم فتح القناة بنجاح مع المالك.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
            <button class="action-btn" style="width: auto; padding: 0 15px;" onclick="sendChatMessage()">إرسال</button>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <div class="nav-tools">
        <button class="nav-btn" onclick="switchTab('tool')">الأدوات</button>
        <button class="nav-btn" onclick="openChat()">الشات</button>
    </div>

    <!-- عبارة التواصل مع المالك -->
    <div class="footer-contact">
        التواصل مع المالك
    </div>

    <script>
        // التحقق من ظهور الشروط أول مرة فقط
        window.onload = function() {
            if (!localStorage.getItem('william_terms_accepted')) {
                document.getElementById('termsModal').style.display = 'flex';
            }
        };

        function acceptTerms() {
            localStorage.setItem('william_terms_accepted', 'true');
            document.getElementById('termsModal').style.display = 'none';
        }

        function rejectTerms() {
            alert('تم رفض الشروط، لا يمكن استخدام التطبيق.');
            window.location.reload();
        }

        function switchTab(mode) {
            if(mode === 'chat') {
                document.getElementById('mainContentArea').style.display = 'none';
                document.getElementById('chatArea').style.display = 'flex';
            } else {
                document.getElementById('chatArea').style.display = 'none';
                document.getElementById('mainContentArea').style.display = 'flex';
            }
        }

        function openChat() {
            switchTab('chat');
        }

        // فحص اليوزر الحقيقي والشريط الاستخباراتي
        function startTargetProcess() {
            const username = document.getElementById('targetUsername').value.trim();
            if(!username) {
                alert('الرجاء إدخال اسم الهدف.');
                return;
            }

            // قائمة الحسابات الوهمية التجريبية (يمكنك تعديلها أو ربطها بالمالك لاحقاً)
            const fakeAccountsList = ['test', 'fake', 'admin', 'guest'];
            if(fakeAccountsList.includes(username.toLowerCase())) {
                alert('لا يوجد حساب بهذا الاسم.');
                return;
            }

            document.getElementById('loadingArea').style.display = 'block';
            document.getElementById('infoRequestBtn').style.display = 'none';
            
            let progress = 0;
            const fill = document.getElementById('progressFill');
            const statusText = document.getElementById('loadingStatusText');
            
            const messages = [
                "جاري البحث عن الحساب..",
                "جاري البحث عن ثغرات..",
                "جاري معالجة المعلومات.."
            ];

            let msgIndex = 0;
            fill.style.width = '0%';

            const interval = setInterval(() => {
                progress += 2;
                fill.style.width = progress + '%';
                
                if(progress === 30 || progress === 60 || progress === 85) {
                    msgIndex = (msgIndex + 1) % messages.length;
                    statusText.textContent = messages[msgIndex];
                }

                if(progress >= 100) {
                    clearInterval(interval);
                    statusText.textContent = "تم اختراق الهدف!";
                    document.getElementById('infoRequestBtn').style.display = 'block';
                }
            }, 100);
        }

        function startSimpleLoading() {
            let progress = 0;
            document.getElementById('loadingArea').style.display = 'block';
            const fill = document.getElementById('progressFill');
            const statusText = document.getElementById('loadingStatusText');
            statusText.textContent = "جاري معالجة الرابط المزيف...";

            const interval = setInterval(() => {
                progress += 5;
                fill.style.width = progress + '%';
                if(progress >= 100) {
                    clearInterval(interval);
                    document.getElementById('loadingArea').style.display = 'none';
                    openChat();
                }
            }, 100);
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text) return;

            const chatMessages = document.getElementById('chatMessages');
            const userMsg = document.createElement('div');
            userMsg.className = 'msg target';
            userMsg.textContent = text;
            chatMessages.appendChild(userMsg);
            
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                const adminMsg = document.createElement('div');
                adminMsg.className = 'msg admin';
                adminMsg.textContent = "تم استلام رسالتك من المالك.";
                chatMessages.appendChild(adminMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 600);
        }
    </script>
</body>
          </html>
